services:
  - type: worker
    name: kyawzin-proxy-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python proxy.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"